services:
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-dados:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  backend:
    image: node:16
    working_dir: /app
    command: sh -c "npm ci && npm install --no-save nodemon@2.0.22 && node node_modules/nodemon/bin/nodemon.js -L app.js"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/test
      EMAIL_SERVICE: ${EMAIL_SERVICE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    image: curlimages/curl:8.10.1
    entrypoint: ["sh", "/seed-utilizadores.sh"]
    environment:
      API_URL: http://backend:8080
    volumes:
      - ./docker/seed-utilizadores.sh:/seed-utilizadores.sh:ro
    depends_on:
      - backend
    restart: "no"

  frontend:
    image: node:16
    working_dir: /app
    command: sh -c "npm ci && npm run serve -- --host 0.0.0.0 --port 8081"
    environment:
      VUE_APP_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-dados:
  backend-node-modules:
  frontend-node-modules:
