# Animalec em contentores: MongoDB, back-end (Express) e front-end (Vue 2).
# Uso: docker compose up        (ver docker/README.md)
services:
  mongo:
    image: mongo:4.4            # o Mongoose 5 do projeto não suporta versões recentes do MongoDB
    ports:
      - "27017:27017"
    volumes:
      - mongo-dados:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  backend:
    image: node:16              # vue-cli 4 / webpack 4 e dependências antigas não correm em Node >= 17
    working_dir: /app
    # nodemon (sem o acrescentar ao package.json): reinicia a API quando o código muda;
    # -L usa polling, necessário para detetar alterações em volumes montados
    command: sh -c "npm ci && npx --yes nodemon@3 -L app.js"
    environment:
      PORT: 8080                  # porta do enunciado
      MONGODB_URI: mongodb://mongo:27017/test   # base do enunciado
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    image: curlimages/curl:8.10.1
    entrypoint: ["sh", "/seed-utilizadores.sh"]
    environment:
      API_URL: http://backend:8080
    volumes:
      - ./docker/seed-utilizadores.sh:/seed-utilizadores.sh:ro
    depends_on:
      - backend
    restart: "no"

  frontend:
    image: node:16
    working_dir: /app
    command: sh -c "npm ci && npm run serve -- --host 0.0.0.0 --port 8081"
    environment:
      VUE_APP_API_URL: http://localhost:8080   # o browser corre no anfitrião, por isso é localhost
      CHOKIDAR_USEPOLLING: "true"              # recarregamento automático com volumes montados
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-dados:
  backend-node-modules:
  frontend-node-modules:
